name: PSX News Fetch

on:
  workflow_dispatch:
  schedule:
    # 09:05, 09:35 and 11:05 PKT on weekdays
    # (04:05, 04:35 and 06:05 UTC)
    - cron: "5 4 * * 1-5"
    - cron: "35 4 * * 1-5"
    - cron: "5 6 * * 1-5"

permissions:
  contents: write

concurrency:
  group: psx-repo-updates
  cancel-in-progress: false

jobs:
  fetch-news:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Fetch last-24-hour news
        run: |
          python news_fetcher.py

      - name: Verify news file
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          p = Path("news_raw_24h.json")
          if not p.exists():
              raise SystemExit("news_raw_24h.json was not created")

          data = json.loads(p.read_text(encoding="utf-8"))
          print("Fetched headlines:", data.get("count", 0))
          print("Fetched at:", data.get("fetched_at"))

          if not isinstance(data.get("items"), list):
              raise SystemExit("Invalid news payload")
          PY

      - name: Commit fresh news
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add news_raw_24h.json

          if git diff --cached --quiet; then
            echo "No news changes."
            exit 0
          fi

          git commit -m "Update PSX news feed"

          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
