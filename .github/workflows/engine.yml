name: PSX Engine Run

permissions:
  contents: write

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 4-10 * * 1-5'

jobs:
  run-engine:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests certifi truststore vaderSentiment openpyxl
          
      - name: Run engine
        run: python main.py run
        env:
          TZ: Asia/Karachi
          
      - name: Commit database changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Pull latest changes first
          git pull origin main --rebase || echo "No remote changes to pull"
          
          # Add and commit the database
          git add psx_engine.db
          git diff --staged --quiet || git commit -m "Auto-run engine $(date -u +'%Y-%m-%dT%H:%MZ')" || echo "No changes to commit"
          
          # Push
          git push origin main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
