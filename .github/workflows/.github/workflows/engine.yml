name: PSX Engine Run

on:
  schedule:
    # Runs every 15 minutes from 9:00 AM to 3:45 PM PKT (UTC+5), Mon-Fri
    - cron: '*/15 4-10 * * 1-5'
  workflow_dispatch:  # Allows you to run it manually

jobs:
  run-engine:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests certifi truststore vaderSentiment openpyxl
          
      - name: Run engine
        run: python main.py run
        env:
          TZ: Asia/Karachi
          
      - name: Commit database changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add psx_engine.db
          git diff --staged --quiet || git commit -m "Auto-run engine $(date -u +'%Y-%m-%dT%H:%MZ')"
          git push
