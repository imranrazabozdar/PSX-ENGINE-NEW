name: PSX Engine Run

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 4-10 * * 1-5"

permissions:
  contents: write

concurrency:
  group: psx-engine
  cancel-in-progress: false

jobs:
  run-engine:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run PSX Engine
        env:
          TZ: Asia/Karachi
          PYTHONUNBUFFERED: "1"
        run: |
          python main.py run

      - name: Verify database
        run: |
          ls -lh psx_engine.db
          python - <<'PY'
          import sqlite3
          db = sqlite3.connect("psx_engine.db")
          tables = db.execute(
              "SELECT name FROM sqlite_master WHERE type='table'"
          ).fetchall()
          print("Database tables:", tables)

          try:
              count = db.execute("SELECT COUNT(*) FROM runs").fetchone()[0]
              print("Run records:", count)
          except Exception as e:
              print("Could not read runs:", e)

          db.close()
          PY

      - name: Commit database
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add psx_engine.db

          if git diff --cached --quiet; then
            echo "No database changes."
            exit 0
          fi

          git commit -m "Update PSX engine database"

      - name: Push database safely
        run: |
          git fetch origin main

          git rebase origin/main

          git push origin HEAD:main
