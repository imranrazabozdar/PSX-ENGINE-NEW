name: PSX Engine Run

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 4-10 * * 1-5'

jobs:
  run-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          pip install pandas numpy requests certifi truststore vaderSentiment openpyxl
      - name: Run engine
        run: python main.py run
      - name: Commit database
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add psx_engine.db
          git diff --staged --quiet || git commit -m "Auto-run engine"
          git push
