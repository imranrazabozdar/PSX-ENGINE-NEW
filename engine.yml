name: PSX Engine Run

permissions:
  contents: write

on:
  workflow_dispatch:
  schedule:
    # 09:00-15:00 Pakistan Standard Time, Monday-Friday.
    # GitHub cron uses UTC: PKT = UTC+5.
    - cron: "*/15 4-10 * * 1-5"

jobs:
  run-engine:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install complete project dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run PSX engine
        env:
          TZ: Asia/Karachi
          PYTHONUNBUFFERED: "1"
        run: python main.py run

      - name: Commit database changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add psx_engine.db

          if git diff --cached --quiet; then
            echo "No database changes to commit."
            exit 0
          fi

          git commit -m "Auto-run PSX engine $(date -u +'%Y-%m-%dT%H:%MZ')"

          # The workflow has write permission through GITHUB_TOKEN.
          git push origin HEAD:main
