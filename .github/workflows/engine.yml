name: PSX Engine Run

on:
  workflow_dispatch:
  schedule:
    # Every 5 minutes during PSX market hours
    # UTC 04:00-10:59 = Pakistan 09:00-15:59
    - cron: "*/5 4-10 * * 1-5"

permissions:
  contents: write

# Prevent multiple workflows from simultaneously modifying the
# database/JSON files and causing non-fast-forward push errors.
concurrency:
  group: psx-repo-updates
  cancel-in-progress: false

jobs:
  run-engine:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ============================================================
      # 15-MINUTE INFORMATION REFRESH
      # ============================================================

      - name: Refresh news and fundamentals
        env:
          TZ: Asia/Karachi
          PYTHONUNBUFFERED: "1"
        run: |

          MINUTE=$(date +%M)

          if [ $((10#$MINUTE % 15)) -eq 0 ]; then

            echo "======================================"
            echo "15-MINUTE INFORMATION REFRESH"
            echo "======================================"

            echo "Refreshing news..."

            if [ -f news_fetcher.py ]; then
              python news_fetcher.py || \
                echo "WARNING: News fetch failed. Continuing with previous data."
            else
              echo "WARNING: news_fetcher.py not found."
            fi


            echo "Refreshing fundamentals..."

            if [ -f main.py ]; then
              python main.py fundamentals || \
                echo "WARNING: Fundamentals refresh failed. Previous data retained."
            else
              echo "WARNING: main.py not found."
            fi

          else

            echo "5-minute technical cycle."
            echo "15-minute information refresh not required."

          fi


      # ============================================================
      # MAIN PSX ENGINE
      # ============================================================

      - name: Run PSX Engine
        env:
          TZ: Asia/Karachi
          PYTHONUNBUFFERED: "1"
        run: |
          echo "======================================"
          echo "RUNNING PSX ENGINE"
          echo "======================================"

          python main.py run


      # ============================================================
      # VERIFY OUTPUTS
      # ============================================================

      - name: Verify engine outputs
        run: |

          echo "======================================"
          echo "DATABASE STATUS"
          echo "======================================"

          if [ -f psx_engine.db ]; then
            ls -lh psx_engine.db
          else
            echo "ERROR: psx_engine.db was not created."
            exit 1
          fi


          python - <<'PY'

          import sqlite3
          from pathlib import Path

          db_path = Path("psx_engine.db")

          print("Database size:",
                round(db_path.stat().st_size / (1024 * 1024), 2),
                "MB")


          try:

              conn = sqlite3.connect(str(db_path))

              tables = conn.execute(
                  """
                  SELECT name
                  FROM sqlite_master
                  WHERE type='table'
                  ORDER BY name
                  """
              ).fetchall()

              print("Database tables:")

              for table in tables:
                  print(" -", table[0])


              try:

                  count = conn.execute(
                      "SELECT COUNT(*) FROM runs"
                  ).fetchone()[0]

                  print("Run records:", count)

              except Exception as e:

                  print("Runs table check:", e)


              conn.close()

          except Exception as e:

              print("Database verification error:", e)

          PY


      # ============================================================
      # SHOW GENERATED DATA
      # ============================================================

      - name: Verify cached data
        run: |

          echo "======================================"
          echo "CACHED DATA"
          echo "======================================"


          if [ -f fundamentals.json ]; then

            echo "Fundamentals:"
            ls -lh fundamentals.json

          else

            echo "fundamentals.json not found."

          fi


          if [ -f news_raw_24h.json ]; then

            echo "News:"
            ls -lh news_raw_24h.json

          else

            echo "news_raw_24h.json not found."

          fi


          if [ -f news_signals.json ]; then

            echo "News signals:"
            ls -lh news_signals.json

          else

            echo "news_signals.json not found."

          fi


      # ============================================================
      # COMMIT GENERATED DATA
      # ============================================================

      - name: Commit generated data
        run: |

          git config user.name "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"


          git add \
            psx_engine.db \
            fundamentals.json \
            news_raw_24h.json \
            news_signals.json \
            2>/dev/null || true


          if git diff --cached --quiet; then

            echo "No generated data changes."

          else

            git commit -m "Update PSX engine data"

          fi


      # ============================================================
      # SYNCHRONIZE WITH MAIN BEFORE PUSH
      # ============================================================

      - name: Rebase and push
        run: |

          git fetch origin main

          git rebase origin/main

          git push origin HEAD:main
